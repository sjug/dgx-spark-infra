---
dgx_spark_minimal_packages:
  - btop
  - ccache
  - git-lfs
  - iperf3
  - lm-sensors
  - python3-dev
  - ripgrep

dgx_spark_podman_ppa: ppa:sejug/podman
dgx_spark_podman_ppa_name: sejug-ubuntu-podman-noble
dgx_spark_podman_ppa_uri: https://ppa.launchpadcontent.net/sejug/podman/ubuntu/
dgx_spark_podman_ppa_suite: noble
dgx_spark_podman_ppa_components:
  - main
dgx_spark_podman_ppa_key_url: >-
  https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x684BEBD921EA83F5FBC4D65464FD56841E91C229
dgx_spark_podman_apt_pin_path: /etc/apt/preferences.d/sejug-podman
# Every package the PPA publishes comes from the PPA. 990 beats Ubuntu
# (500) and ESM (510) without letting apt downgrade (that needs >= 1000).
dgx_spark_podman_apt_pin_content: |
  Package: *
  Pin: release o=LP-PPA-sejug-podman
  Pin-Priority: 990
# Older hand-written pins for the same PPA; removed so only the pin above applies.
dgx_spark_podman_legacy_apt_pin_paths:
  - /etc/apt/preferences.d/podman-ppa
dgx_spark_podman_reinstall_if_not_from_ppa: true
dgx_spark_podman_policy_source: ppa.launchpadcontent.net/sejug/podman
dgx_spark_podman_install_recommends: false
dgx_spark_podman_packages:
  - aardvark-dns
  - catatonit
  - passt
  - podman
  - uidmap
dgx_spark_podman_replacement_packages:
  - podman
dgx_spark_podman_legacy_packages_absent:
  - buildah
  - fuse-overlayfs
  - libslirp0
  - slirp4netns
