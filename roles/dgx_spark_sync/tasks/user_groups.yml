---
- name: Ensure required groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ dgx_spark_sync_managed_user_groups }}"

- name: Sync managed user group memberships
  ansible.builtin.user:
    name: "{{ managed_user }}"
    groups: "{{ dgx_spark_sync_managed_user_groups }}"
    append: false
