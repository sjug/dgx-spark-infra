---
- name: Verify required host variables are set
  tags: [always]
  vars:
    dgx_spark_sync_ipv4_regex: >-
      ^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$
  ansible.builtin.assert:
    that:
      - managed_user is defined and managed_user | length > 0
      - machine_hostname is defined and machine_hostname | length > 0
      - peer_host is defined and peer_host | length > 0
      - peer_ip is defined and peer_ip is match(dgx_spark_sync_ipv4_regex)
      - peer_ib_ip is defined and peer_ib_ip is match(dgx_spark_sync_ipv4_regex)
      - ib_peer_name is defined and ib_peer_name | length > 0
    fail_msg: >-
      Missing or invalid host variables. Check inventory/hosts.yml for
      {{ inventory_hostname }}.

# Static imports so tags apply to the imported tasks themselves; with
# include_tasks only the include statement is tagged and tag-scoped runs
# (e.g. --tags packages) would skip everything inside the file.
- name: Sync user/groups
  ansible.builtin.import_tasks: user_groups.yml
  tags: [users, groups]

- name: Sync packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: Sync services
  ansible.builtin.import_tasks: services.yml
  tags: [services]

- name: Sync sysctl configs
  ansible.builtin.import_tasks: config_dir_sync.yml
  tags: [configs, sysctl]
  vars:
    dgx_spark_sync_dir_src: etc_sysctl.d
    dgx_spark_sync_dir_dest: /etc/sysctl.d
    dgx_spark_sync_dir_notify: reload sysctl

- name: Sync modprobe configs
  ansible.builtin.import_tasks: config_dir_sync.yml
  tags: [configs, modprobe]
  vars:
    dgx_spark_sync_dir_src: etc_modprobe.d
    dgx_spark_sync_dir_dest: /etc/modprobe.d
    dgx_spark_sync_dir_notify: update initramfs

- name: Sync NVIDIA container runtime config
  ansible.builtin.import_tasks: config_nvidia.yml
  tags: [configs, nvidia]

- name: Sync network configs
  ansible.builtin.import_tasks: config_dir_sync.yml
  tags: [configs, network]
  vars:
    dgx_spark_sync_dir_src: etc_NetworkManager_conf.d
    dgx_spark_sync_dir_dest: /etc/NetworkManager/conf.d
    dgx_spark_sync_dir_notify: restart networkmanager

- name: Sync SSH configs
  ansible.builtin.import_tasks: config_ssh.yml
  tags: [configs, ssh]

- name: Sync hosts and GRUB configs
  ansible.builtin.import_tasks: config_misc.yml
  tags: [configs, hosts, grub]
