---
- name: Sync sshd config directory
  ansible.builtin.import_tasks: config_dir_sync.yml
  vars:
    dgx_spark_sync_dir_src: etc_ssh_sshd_config.d
    dgx_spark_sync_dir_dest: /etc/ssh/sshd_config.d
    dgx_spark_sync_dir_notify: restart sshd

- name: Ensure ssh service is enabled and started
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

- name: Gather service facts for SSH units
  ansible.builtin.service_facts:

- name: Disable ssh.socket when present
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  when: "'ssh.socket' in ansible_facts.services"
